<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра обновляется!</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            background-color: #f7f7f7;
            margin: 0;
            padding: 20px;
            overflow: hidden; /* Чтобы не появлялись полосы прокрутки при прыжке */
        }

        /* Стиль для текста сверху */
        h1 {
            color: #535353;
            margin-bottom: 10px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Контейнер игры */
        #game-container {
            width: 600px;
            height: 200px;
            border-bottom: 2px solid #535353;
            margin: 0 auto;
            position: relative;
            background-color: #fff;
            overflow: hidden;
        }

        /* Наш "Динозаврик" (серый квадрат) */
        #dino {
            width: 50px;
            height: 50px;
            background-color: #535353;
            position: absolute;
            bottom: 0;
            left: 50px;
        }

        /* Кактус (зеленый прямоугольник) */
        #cactus {
            width: 20px;
            height: 40px;
            background-color: #2ecc71;
            position: absolute;
            bottom: 0;
            left: 580px; /* Начальная позиция справа */
        }

        /* Анимация прыжка */
        .animate-jump {
            animation: jump 500ms linear;
        }

        @keyframes jump {
            0% { bottom: 0; }
            30% { bottom: 100px; }
            70% { bottom: 100px; }
            100% { bottom: 0; }
        }

        /* Анимация движения кактуса */
        .animate-cactus {
            animation: moveCactus 1.5s infinite linear;
        }

        @keyframes moveCactus {
            0% { left: 580px; }
            100% { left: -40px; }
        }

        /* Счет */
        #score {
            margin-top: 10px;
            font-size: 20px;
            color: #333;
        }

        /* Сообщение о проигрыше */
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Текст, который вы просили -->
    <h1>Игра обновляется. Ждите релиза!</h1>

    <div id="game-container">
        <div id="dino"></div>
        <div id="cactus" class="animate-cactus"></div>
        
        <div id="game-over">
            <h2>Ой! Вы врезались.</h2>
            <p>Нажмите Пробел, чтобы начать заново</p>
        </div>
    </div>

    <div id="score">Счет: 0</div>

    <script>
        const dino = document.getElementById("dino");
        const cactus = document.getElementById("cactus");
        const scoreElement = document.getElementById("score");
        const gameOverElement = document.getElementById("game-over");
        
        let score = 0;
        let isGameOver = false;

        // Функция прыжка
        function jump() {
            // Если игра окончена, перезапускаем её
            if (isGameOver) {
                resetGame();
                return;
            }

            // Если класс уже есть (мы уже в прыжке), ничего не делаем
            if (dino.classList.contains("animate-jump")) {
                return;
            }
            
            dino.classList.add("animate-jump");
            
            // Удаляем класс после завершения анимации (500мс)
            setTimeout(function() {
                dino.classList.remove("animate-jump");
            }, 500);
        }

        // Основной цикл проверки столкновений
        let checkDead = setInterval(function() {
            if (isGameOver) return;

            // Получаем текущую позицию динозавра (верхняя точка)
            let dinoTop = parseInt(window.getComputedStyle(dino).getPropertyValue("top"));
            
            // Получаем текущую позицию кактуса (левая точка)
            let cactusLeft = parseInt(window.getComputedStyle(cactus).getPropertyValue("left"));

            // Логика столкновения:
            // 1. Кактус находится в зоне динозавра (между 0 и 50px слева)
            // 2. Динозавр находится на земле (top больше 150px, так как высота контейнера 200, а дино 50)
            if (cactusLeft < 50 && cactusLeft > 0 && dinoTop >= 150) {
                gameOver();
            } else {
                // Если живы, увеличиваем счет
                score++;
                // Замедляем набор очков для читаемости (делим на 10)
                if(score % 10 === 0) {
                    scoreElement.innerText = "Счет: " + Math.floor(score / 10);
                }
            }
        }, 10);

        function gameOver() {
            isGameOver = true;
            cactus.style.animation = "none"; // Останавливаем кактус
            cactus.style.display = "none";
            gameOverElement.style.display = "block";
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            scoreElement.innerText = "Счет: 0";
            gameOverElement.style.display = "none";
            cactus.style.display = "block";
            
            // Перезапуск анимации кактуса
            cactus.style.animation = "none";
            cactus.offsetHeight; /* trigger reflow */
            cactus.style.animation = "moveCactus 1.5s infinite linear";
        }

        // Слушаем нажатие клавиш (Пробел или Стрелка Вверх)
        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space' || event.code === 'ArrowUp') {
                jump();
            }
        });
        
        // Для мобильных устройств (клик по экрану)
        document.addEventListener('touchstart', jump);
        document.addEventListener('click', jump);

    </script>
</body>
</html>
